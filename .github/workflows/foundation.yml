name: Foundation checks

on:
  pull_request:
    branches: [DEV]

permissions:
  contents: read

jobs:
  workspace:
    name: Workspace on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal --component clippy
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev libglib2.0-dev libsecret-1-dev libdbus-1-dev libgtk-3-dev libpng-dev libjpeg-dev libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libexpat1-dev libtiff-dev libxdo-dev libappindicator3-dev
      - run: cargo +1.100.0 metadata --locked --format-version 1 --no-deps
      - run: cargo +1.100.0 build --locked --bins --workspace
      - run: cargo +1.100.0 test --locked --workspace
      - if: ${{ !cancelled() }}
        run: cargo +1.100.0 clippy --locked --workspace --all-targets

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt
      - run: cargo +1.100.0 fmt --all -- --check
